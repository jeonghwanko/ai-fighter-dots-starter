       * 본문 글꼴은 부팅 전에 도착해야 한다(main.ts 의 loadUiFont). swap 으로 두면
       * 폴백으로 한 번 재고 끝나서 자간이 어긋난 채 남는다 — 그래서 block 이다.

      @font-face {

        src: url("./fonts/MaruBuri-Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;

      @font-face {

        font-display: block;

        font-family: "Pretendard";

        src: url("./fonts/BlackHanSans-Lettering.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      /* 예고장 표제 전용. 3.4MB 통짜라 부팅을 막지 않고 늦게 도착한다. */
      @font-face {

        src: url("./fonts/ChosunGs.woff") format("woff");
        font-weight: 400;
        font-style: normal;

      html,
      body {
        margin: 0;

      body {

        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);

        padding: 0 16px;
        background: #071923;
        border-bottom: 1px solid rgba(255, 255, 255, 0.16);
      }
      .game-home {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        box-sizing: border-box;
        padding: 0 12px;
        color: #fff;
        font: 700 16px/1.4 "Pretendard", "Malgun Gothic", sans-serif;
        text-decoration: none;
      }
      .game-home:hover { background: rgba(255, 255, 255, 0.09); }
      .game-home:focus-visible { outline: 2px solid #eaff50; outline-offset: -2px; }
      /* The ODDBOUT wordmark is drawn in ink for the homepage's paper: white here, on the ink bar. */
      .game-logo {
        display: block;
        width: auto;
        height: 26px;
        filter: brightness(0) invert(1);
      }
      #game {
        position: relative;
        width: 100%;
        flex: 1;
        min-height: 0;
      }
      #game canvas {
        display: block;
        touch-action: none;
      }
      /* JS와 번들 글꼴을 기다리는 동안에도 시스템 글꼴로 준비 상태를 보여준다. */
      #boot-loading {
        position: absolute;
        inset: 0;
        z-index: 9;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        background: #071923;
        color: #fff;
        font: 600 16px "Pretendard", system-ui, sans-serif;
        pointer-events: none;
      }
      .boot-loading-ring {
        width: 30px;
        height: 30px;
        border: 3px solid rgba(255, 255, 255, 0.16);
        border-top-color: #eaff50;
        border-radius: 50%;
        animation: boot-loading-spin 1s linear infinite;
      }
      #boot-loading .boot-loading-en { display: none; }
      html:lang(en) #boot-loading .boot-loading-ko { display: none; }
      html:lang(en) #boot-loading .boot-loading-en { display: inline; }
      @keyframes boot-loading-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-loading-ring { animation: none; }
      }
      html[data-boot-motion="reduce"] .boot-loading-ring { animation: none; }
