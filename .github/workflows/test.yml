# Manual only: run from the Actions tab or `gh workflow run test.yml --ref <branch>`.
# No push/PR trigger, so nothing runs (or bills) unless someone asks for it.
name: test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # sprite:setup installs img2webp and RIFE itself; ffmpeg/ffprobe come from the system.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run sprite:setup
      - run: npm test
