# Every pull request to main and every push to main; main requires this check before a merge.
# GitHub skips the run when a PR's last commit message carries a skip-ci marker anywhere, body included (this PR's
# first commit quoted it in an explanation and was skipped), and the required check then never reports.
# GitHub-hosted runners only: this repository is public, and a fork's pull request must not reach a self-hosted machine.
name: test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # sprite:setup installs img2webp and RIFE itself; ffmpeg/ffprobe come from the system.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run sprite:setup
      - run: npm test
